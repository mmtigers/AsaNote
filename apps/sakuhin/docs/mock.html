<style>

    --bg: #162019; --surface: #1e2a21; --surface-2: #27362b; --ink: #e5f1e6; --sub: #a2b8a7; --line: #33463a;

}
:root[data-theme="dark"] {

  --calm: #ecc46b; --holiday: #f0899a; --shadow: rgba(0, 0, 0, .5); --mat: #f4f2ed; color-scheme: dark;
}
* { box-sizing: border-box; }
body {

.nav { position: fixed; inset: auto 0 0; z-index: 40; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 95%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

<script>
(() => {
"use strict";
// ---------- データ ----------
const CHILDREN = [
  { id: "hana", name: "はな", birth: "2021-08-20", museum: "はなちゃん美術館" },
  { id: "sota", name: "そうた", birth: "2019-06-03", museum: "そうたくん美術館" },

const FRAMES = [
  { id: "wood", name: "木" }, { id: "white", name: "白" }, { id: "black", name: "黒" },

const autoFrame = (kind) => (kind === "書写・文字" ? "black" : "wood");

// ---------- 年齢と部屋(SPEC §5.3・§5.4) ----------
function parse(d) { const [y, m, day] = d.split("-").map(Number); return { y, m, d: day }; }
function ageAt(birth, date) {
  const b = parse(birth), t = parse(date);
  let months = (t.y - b.y) * 12 + (t.m - b.m);
  if (t.d < b.d) months -= 1;
  return { y: Math.floor(months / 12), m: months % 12 };
}
function fiscalYear(date) { const t = parse(date); return t.m >= 4 ? t.y : t.y - 1; }
function roomName(birth, fy) {
  if (!birth) return `${fy}年度の部屋`;
  const a = ageAt(birth, `${fy}-04-01`).y;
  if (a < 0) return `${fy}年度の部屋`;
  if (a <= 2) return `${a}歳児の部屋`;
  if (a <= 5) return ["年少", "年中", "年長"][a - 3] + "の部屋";
  if (a <= 11) return `${a - 5}年生の部屋`;
  return `${fy}年度の部屋`;
}
const fmtDate = (d) => { const t = parse(d); return `${t.y}年${t.m}月${t.d}日`; };
const ageText = (child, d) => { if (!child.birth) return ""; const a = ageAt(child.birth, d); return `${a.y}歳${a.m}か月`; };

// ---------- クレヨン風の絵(サンプル) ----------
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function kit(ctx, W, H, seed) {
  const r = rng(seed);
  const j = (n) => (r() - .5) * n;
  const k = {
    r, W, H,
    paper(tone = "#FBF8F1") {
      ctx.fillStyle = tone; ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < W * H / 260; i++) { ctx.fillStyle = `rgba(120,100,70,${r() * .05})`; ctx.fillRect(r() * W, r() * H, 1.5, 1.5); }
    },
    line(pts, col, w = 6, passes = 3) {
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = col;
      for (let p = 0; p < passes; p++) {
        ctx.globalAlpha = .55; ctx.lineWidth = w * (.7 + r() * .5); ctx.beginPath();
        pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * W + j(5), y * H + j(5)) : ctx.moveTo(x * W + j(5), y * H + j(5))));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    },
    ring(cx, cy, rx, ry = rx, a0 = 0, a1 = Math.PI * 2) {
      const pts = []; const n = 36;
      for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry * W / H]); }
      return pts;
    },
    fill(pts, col, density = 1, w = 7) {
      ctx.save(); ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H))); ctx.closePath(); ctx.clip();
      const xs = pts.map((p) => p[0] * W), ys = pts.map((p) => p[1] * H);
      const x0 = Math.min(...xs) - 20, x1 = Math.max(...xs) + 20, y0 = Math.min(...ys) - 20, y1 = Math.max(...ys) + 20;
      ctx.strokeStyle = col; ctx.lineCap = "round"; ctx.globalAlpha = .38;
      const step = 7 / density;
      for (let t = x0 - (y1 - y0); t < x1; t += step) {
        ctx.lineWidth = w * (.6 + r() * .7); ctx.beginPath(); ctx.moveTo(t + j(6), y1 + j(6)); ctx.lineTo(t + (y1 - y0) + j(6), y0 + j(6)); ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha = 1;
    },
    blob(pts, col, w = 8) { k.fill(pts, col); k.line([...pts, pts[0]], col, w * .6, 2); },
    paint(pts, col, w = 40) {
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = col; ctx.globalAlpha = .78; ctx.lineWidth = w;
      ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H))); ctx.stroke(); ctx.globalAlpha = 1;
    },
    text(s, x, y, size, col, font = '700 FONT "Zen Kaku Gothic New", sans-serif') {
      ctx.fillStyle = col; ctx.font = font.replace("FONT", `${size}px`); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      [...s].forEach((ch, i) => { ctx.save(); ctx.translate(x * W + (i - (s.length - 1) / 2) * size * 1.05, y * H + j(size * .2)); ctx.rotate(j(.4)); ctx.globalAlpha = .8; ctx.fillText(ch, 0, 0); ctx.restore(); });

    dot(x, y, s, col) { ctx.fillStyle = col; ctx.globalAlpha = .85; ctx.beginPath(); ctx.arc(x * W, y * H, s, 0, 7); ctx.fill(); ctx.globalAlpha = 1; },
  };
  return k;
}
const SIZE = { portrait: [600, 822], landscape: [822, 600], hanshi: [560, 772], square: [640, 640] };

// ---------- 射影変換(四隅合わせ) ----------
function solve(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    for (let r = i + 1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; }
  }
  const x = new Array(n);
  for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c]; x[i] = s / A[i][i]; }
  return x;
}
/** from の4点を to の4点へ写す 3x3 の行列(最後は1) */
function homography(from, to) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = from[i], [u, v] = to[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  return solve(A, b);
}
function sampler(srcCanvas) {
  const w = srcCanvas.width, h = srcCanvas.height; const d = srcCanvas.getContext("2d").getImageData(0, 0, w, h).data;
  return (x, y, out, o) => {
    if (x < 0 || y < 0 || x > w - 1 || y > h - 1) return false;
    const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, w - 1), y1 = Math.min(y0 + 1, h - 1), fx = x - x0, fy = y - y0;
    for (let c = 0; c < 3; c++) {
      const a = d[(y0 * w + x0) * 4 + c], bb = d[(y0 * w + x1) * 4 + c], cc = d[(y1 * w + x0) * 4 + c], dd = d[(y1 * w + x1) * 4 + c];
      out[o + c] = (a * (1 - fx) + bb * fx) * (1 - fy) + (cc * (1 - fx) + dd * fx) * fy;
    }
    out[o + 3] = 255; return true;
  };
}
/** 写真の中の四角形 quad を、outW×outH の長方形に引き伸ばす */
function warpToRect(src, quad, outW, outH) {
  const H = homography([[0, 0], [outW, 0], [outW, outH], [0, outH]], quad);
  const out = makeCanvas(outW, outH); const ctx = out.getContext("2d"); const img = ctx.createImageData(outW, outH); const s = sampler(src);
  for (let y = 0; y < outH; y++) for (let x = 0; x < outW; x++) {
    const w = H[6] * x + H[7] * y + 1; const sx = (H[0] * x + H[1] * y + H[2]) / w, sy = (H[3] * x + H[4] * y + H[5]) / w;
    s(sx, sy, img.data, (y * outW + x) * 4);
  }
  ctx.putImageData(img, 0, 0); return out;
}

  $app.querySelector("#rot").onclick = () => { const s = c.src; const r = makeCanvas(s.height, s.width); const g = r.getContext("2d"); g.translate(r.width, 0); g.rotate(Math.PI / 2); g.drawImage(s, 0, 0); loadSource(r); };
  $app.querySelector("#reset").onclick = () => loadSource(c.src);
  $app.querySelector("#skip").onclick = () => { c.corrected = c.src; c.noCorrect = true; c.step = 3; viewCollect(); };
  $app.querySelector("#apply").onclick = (e) => {
    e.target.disabled = true; e.target.textContent = "直しています…";
    setTimeout(() => {
      const p = c.pts, d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
      const w = (d(p[0], p[1]) + d(p[3], p[2])) / 2, h = (d(p[0], p[3]) + d(p[1], p[2])) / 2; const s = Math.min(1, 900 / Math.max(w, h));
      c.corrected = warpToRect(c.src, p, Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))); c.noCorrect = false; c.step = 3; viewCollect();
    }, 30);
  };
}

function collectForm() {
  const c = state.collect; const kv = c.keepValues || {};
  const f = c.form || (c.form = { child: kv.child || state.child, date: kv.date || today, title: "", kind: kv.kind || (c.noCorrect ? "工作" : "絵"), memo: "", frame: "auto", featured: false, keep: false });
  if (!c.previewUrl) c.previewUrl = c.corrected.toDataURL("image/jpeg", .86);
  const preview = { w: c.corrected.width, h: c.corrected.height, src: c.previewUrl, title: f.title, kind: f.kind, frame: f.frame, hue: 140 };
  const child = childOf(f.child);
  collectHeader("作品の情報", () => { c.step = 2; c.previewUrl = null; viewCollect(); });
  $app.innerHTML = `<div style="display:grid;gap:14px">
    ${stepsBar(3)}
    <div class="showcase big">${frameHTML(preview, `--maxw:${preview.w >= preview.h ? 300 : 210}px`)}</div>
    ${CHILDREN.length > 1 ? `<div class="field"><span>作者</span><div class="pills" role="group" aria-label="作者">${CHILDREN.map((x) => `<button type="button" class="pill" data-fc="${x.id}" aria-pressed="${x.id === f.child}">${esc(x.name)}</button>`).join("")}</div></div>` : ""}
    <label class="field"><span>制作日</span><input type="date" id="f-date" value="${f.date}" max="${today}"><span class="age">${child.birth ? `${ageText(child, f.date)}のとき ・ ${roomName(child.birth, fiscalYear(f.date))}に飾ります` : ""}</span></label>
    <label class="field"><span>タイトル<em>任意</em></span><input type="text" id="f-title" maxlength="50" value="${esc(f.title)}" placeholder="例: ママとうさぎ"></label>
    <div class="field"><span>種類</span><div class="pills wrap" role="group" aria-label="種類">${KINDS.map((k) => `<button type="button" class="pill" data-kind="${k}" aria-pressed="${k === f.kind}">${k}</button>`).join("")}</div></div>
    <label class="field"><span>ひとことメモ<em>任意</em></span><textarea id="f-memo" maxlength="200" placeholder="例: うさぎがママをおむかえにきたところ">${esc(f.memo)}</textarea></label>
    <div class="field"><span>額縁</span><div class="pills wrap" role="group" aria-label="額縁"><button type="button" class="pill" data-ff="auto" aria-pressed="${f.frame === "auto"}">自動(${FRAMES.find((x) => x.id === autoFrame(f.kind)).name})</button>${FRAMES.map((x) => `<button type="button" class="pill" data-ff="${x.id}" aria-pressed="${f.frame === x.id}">${x.name}</button>`).join("")}</div></div>
    <section class="card setting">
      <label class="switch"><span>常設展に飾る<small>お気に入りの部屋に並べます</small></span><input type="checkbox" id="f-featured" ${f.featured ? "checked" : ""}></label>
      <label class="switch"><span>実物保管<small>実物も手元に残す作品</small></span><input type="checkbox" id="f-keep" ${f.keep ? "checked" : ""}></label>
    </section>
    <div class="sticky-cta"><button type="button" class="btn-main" id="save">収蔵する</button></div>
  </div>`;
  const rerender = () => { const y = window.scrollY; collectForm(); window.scrollTo(0, y); };
  const sync = () => { f.title = $app.querySelector("#f-title").value; f.memo = $app.querySelector("#f-memo").value; };
  $app.querySelectorAll("[data-fc]").forEach((b) => b.onclick = () => { sync(); f.child = b.dataset.fc; rerender(); });
  $app.querySelector("#f-date").onchange = (e) => { sync(); if (e.target.value) f.date = e.target.value; rerender(); };
  $app.querySelector("#f-title").oninput = sync; $app.querySelector("#f-memo").oninput = sync;
  $app.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { sync(); f.kind = b.dataset.kind; rerender(); });
  $app.querySelectorAll("[data-ff]").forEach((b) => b.onclick = () => { sync(); f.frame = b.dataset.ff; rerender(); });
  $app.querySelector("#f-featured").onchange = (e) => { f.featured = e.target.checked; };
  $app.querySelector("#f-keep").onchange = (e) => { f.keep = e.target.checked; };
  $app.querySelector("#save").onclick = (e) => {
    sync(); e.target.disabled = true; e.target.textContent = "保存しています…";
    // 実際のアプリでは、サーバーへの保存の成功を確かめてから完了の案内を出す(SPEC §5.6)
    setTimeout(() => {
      const w = addWork({ child: f.child, date: f.date, title: f.title.trim(), kind: f.kind, memo: f.memo.trim(), frame: f.frame, featured: f.featured, keep: f.keep, canvas: c.corrected, hue: 140 });
      c.saved = w; c.step = 4; c.previewUrl = null; viewCollect(); window.scrollTo(0, 0);
    }, 500);
  };
}
function collectDone() {
  const c = state.collect; const w = c.saved; const child = childOf(w.child);
  collectHeader("収蔵しました");
  $app.innerHTML = `
    <section class="card done enter">
      <span class="emoji" aria-hidden="true">🎉</span>
      <h2>収蔵しました</h2>
      ${frameHTML(w)}
      <p>${w.keep ? `${esc(child.museum)}に飾りました。<br>実物も大切に保管しましょう。` : `${esc(child.museum)}に飾りました。<br>実物は手放しても大丈夫です。`}</p>
    </section>
    <button type="button" class="btn-main" id="more">📷 続けて収蔵する</button>
    <button type="button" class="btn-sub" id="see">作品を見る</button>`;
  const reset = (keep) => Object.assign(c, { step: 1, src: null, pts: null, corrected: null, form: null, saved: null, previewUrl: null, keepValues: keep });
  $app.querySelector("#more").onclick = () => { const f = c.form; reset({ child: f.child, date: f.date, kind: f.kind }); viewCollect(); };
  $app.querySelector("#see").onclick = () => { state.child = w.child; state.room = String(fiscalYear(w.date)); state.workId = w.id; state.from = "gallery"; reset(null); location.hash = "work"; };
}

// ---------- 画面の切り替え ----------
const VIEWS = { gallery: viewGallery, featured: viewFeatured, work: viewWork, collect: viewCollect, group: viewGroup };
function route() {
  const v = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "gallery";
  const tab = v === "work" ? (state.from || "gallery") : v;
  document.querySelectorAll(".nav a").forEach((a) => { if (a.dataset.view === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  VIEWS[v](); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.querySelector('.nav a[data-view="collect"]').addEventListener("click", () => { if (location.hash === "#collect" && state.collect.step !== 1) { Object.assign(state.collect, { step: 1, src: null, pts: null, corrected: null, form: null, saved: null, previewUrl: null, keepValues: null }); route(); } });

const fontsReady = Promise.race([
  Promise.all([document.fonts.load('700 100px "Shippori Mincho"', "やまそうた"), document.fonts.load('700 30px "Zen Kaku Gothic New"', "ままぱぱはな"), document.fonts.load('700 16px "Zen Maru Gothic"', "さくひん")]).catch(() => {}),
  new Promise((r) => setTimeout(r, 1500)),
]);
$app.innerHTML = '<p class="empty">作品を並べています…</p>';
fontsReady.then(() => { seed(); route(); });
})();
</script>
