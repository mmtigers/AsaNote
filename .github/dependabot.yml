# Issue #60: 依存更新の自動化。以前は dependabot が無く、typescript 5→7 / eslint 9→10 /
# vitest 4→5 / eslint-config-next 16.3.0 と next 16.3.5 のズレなどが手作業で放置されていた。
# 姉妹リポジトリ(Suwalist)と同じ方針: minor/patch は週次で1本のグループ PR、メジャーは個別 PR。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    # メジャーは互換確認が必要なため個別PRのまま残す:
    # - eslint 9→10 (eslint-config-next の対応待ち)
    # - typescript 5→7
    # - vitest / @vitest/coverage-v8 4→5
    # - @types/node 20→22(CI の Node 22 に合わせて上げる判断は別途)
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
