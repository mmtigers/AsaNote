name: CI (core)

# packages/core(あさノート・よるノートの共通コード)の lint・型検査・テスト。
# core を取り込む各アプリ側の確認は、ci.yml / ci-yoru.yml が同じ PR で別に行う。

on:
  # main への push では走らせない(マージ前の PR の CI で済ませる。#225)。
  pull_request:
    branches: [main, master]
    # Issue #225: 無料枠(月2,000分)を守るため、core・ルートの設定・CI の定義に関わる変更だけ走らせる。
    paths:
      - "packages/core/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/ci-core.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # モノレポ: package-lock.json はルートにあるので、ルートで全ワークスペースを入れる。
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      # 数値を job summary に出す(#207)。閾値でのブロックはしない。
      - name: Coverage summary
        if: always()
        run: node ../../scripts/coverage-summary.mjs coverage/coverage-summary.json packages/core
