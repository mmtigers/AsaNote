name: CI (yorunote)

# モノレポ化(apps/yoru)に伴い、よるノート用のCIとしてルートの .github/workflows に置いたもの。
# あさノート用の ci.yml とは別ワークフロー。共通のジョブ(依存の検査・lint・型・単体テスト・ビルド、更新履歴の検査)は
# _app-ci.yml にあり、ここにはよるノート固有のもの(E2E・型ずれの検査)だけを置く。

on:
  # main への push では走らせない(マージ前の PR の CI で済ませる。#225)。
  pull_request:
    branches: [main, master]
    # ラベル・PR本文による例外指定(release-notes-check)を、付けた/書き換えた直後に反映させる(あさノート用の ci.yml と同じ)。
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
    # Issue #225: Actions の無料枠(月2,000分)を守るため、関係のない変更では走らせない。
    # このアプリ・共通コード・DB・CI の定義・ドキュメント(docsConsistency が読む)が対象。
    paths:
      - "apps/yoru/**"
      - "packages/core/**"
      - "supabase/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/**"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #60: 明示しないとリポジトリ設定次第で write 権限のトークンが供給される。全ジョブ読み取り専用。
permissions:
  contents: read

jobs:
  lint-build-test:
    # ドラフトの PR では走らせない(Issue #225。ready にした時と、その後の push で走る)。
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/_app-ci.yml
    with:
      app: apps/yoru
      check-schema: true

  e2e:
    # ドラフトの PR では走らせない(Issue #225。ready にした時と、その後の push で走る)。
    if: ${{ !github.event.pull_request.draft }}
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/yoru
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # モノレポ: package-lock.json はルートにあるので、ルートで全ワークスペースを入れる。
        working-directory: .
        run: npm ci

      # ログイン無し(端末内の IndexedDB だけ)の動きを確かめる。実DB・同期は対象外(Issue #12 の実機確認)。
      # Supabase の URL は CSP の接続先の許可に使われるため、placeholder を渡す(通信は発生しない)。
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/yoru/playwright-report/
            apps/yoru/test-results/
          retention-days: 7

  db-types-check:
    # ドラフトの PR では走らせない(Issue #225。ready にした時と、その後の push で走る)。
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/_db-types-check.yml
    with:
      # 素のPostgresへ、共通表・auth・storage のスタブ → schema.sql の順に適用する。
      sql-files: apps/yoru/supabase/ci/auth-stub.sql apps/yoru/supabase/ci/shared-tables-stub.sql apps/yoru/supabase/schema.sql apps/yoru/supabase/schema.sql
      types-file: apps/yoru/src/lib/db/database.types.ts
      app: apps/yoru
      schema-file: apps/yoru/supabase/schema.sql
