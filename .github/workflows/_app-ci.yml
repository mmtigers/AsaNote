name: CI (アプリ共通)

# あさノート(ci.yml)とよるノート(ci-yoru.yml)から呼ばれる、共通のジョブ(#156)。
# 依存の検査・lint・型・単体テスト・ビルドと、更新履歴の検査。アプリごとに違う E2E・型ずれの検査は、
# 各アプリの CI ファイルに残してある。
# 呼び出し元のトリガー(push / pull_request)と github.event の中身は、そのまま引き継がれる。

on:
  workflow_call:
    inputs:
      app:
        description: 対象アプリのディレクトリ(apps/asa など)
        type: string
        required: true
      check-schema:
        description: supabase/schema.sql が evening_* 以外に触れていないかを検査する(よるノート用)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      # 更新履歴の検査は BASE との差分を見るため、全履歴を取る(fetch-depth: 0)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # 以前は別ジョブ(release-notes-check)だったが、数秒で終わるのに1ジョブ=最低1分で課金されるため、
      # このジョブの先頭へ統合した(#209。Actions の無料枠は月2,000分)。依存の導入より前に置くので、
      # 更新履歴の不足は数秒で分かる(失敗時に重い step を回さない)。
      # ユーザー向けの変更なのに src/data/releases.ts が更新されない、またはversionが
      # releases.ts / package.json / package-lock.json でずれる場合は失敗させる。
      # 更新履歴に載せない変更(依存更新・内部リファクタ等)は、PRに `no-release-note` ラベルを
      # 付けるか、PR本文・コミットメッセージに `[skip release-note]` と書くと例外にできる。
      # 判定の中身はリポジトリルートの scripts/check-release-notes.mjs(あさノート・よるノート共通。テストは apps/asa/src/lib/releaseNotesCheck.test.ts)。
      # PRのタイトル・本文・ラベルは外部入力なので、シェルへ直接埋め込まず環境変数で渡す。
      - name: Release notes check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ../../scripts/check-release-notes.mjs

      - name: Install dependencies
        # モノレポ: package-lock.json はルートにあるので、ルートで全ワークスペースを入れる。
        working-directory: .
        run: npm ci

      # 本番に入る依存(dependencies)だけを検査する。devDependencies(eslint-config-next 経由の
      # braces, GHSA-vfj7-8cjw-p6xm)には npm 上に修正版が無く、本番コードには入らないため対象外。
      # braces に修正版が出たら --omit=dev を外して全依存の検査へ戻す。
      - name: Security audit
        working-directory: .
        run: npm audit --audit-level=high --omit=dev --workspace ${{ inputs.app }}

      - name: Lint
        run: npm run lint

      # よるノートだけ: 共有モードではあさノートと同じDBへ適用するため、schema.sql が evening_* 以外に
      # 触れていないかを静的に検査する(DROP / ALTER を共通表へ向けない。docs/SPEC.md §7)。
      - name: Check schema.sql only touches evening_* objects
        if: ${{ inputs.check-schema }}
        run: npm run check:schema

      # CI の型生成に使う共通表のスタブが、共通表の正(あさノートの supabase/schema.sql)とずれていないか。
      - name: Check shared-tables stub matches the asa schema
        if: ${{ inputs.check-schema }}
        run: npm run check:stub

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (with coverage)
        # Issue #60: 以前は npm run test のみでカバレッジを CI で計測・保存していなかった。
        # 閾値は設けず(vitest.config.mts のコメント参照)、成果物として残して推移を見る。
        run: npm run test:coverage

      # 数値を job summary に出す(#207)。成果物を開かなくても、PR の画面から推移が分かる。閾値でのブロックはしない。
      - name: Coverage summary
        if: always()
        env:
          APP: ${{ inputs.app }}
        run: node ../../scripts/coverage-summary.mjs coverage/coverage-summary.json "$APP"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ${{ inputs.app }}/coverage/
          retention-days: 14

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
