name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # ラベル・PR本文による例外指定(release-notes-check)を、付けた/書き換えた直後に反映させる。
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #60: 明示しないとリポジトリ設定次第で write 権限のトークンが供給される。全ジョブ読み取り専用。
permissions:
  contents: read

# 共通のジョブ(依存の検査・lint・型・単体テスト・ビルド、更新履歴の検査)は _app-ci.yml にある(#156)。
# ここにはあさノート固有のもの(E2E・型ずれの検査)だけを置く。
jobs:
  lint-build-test:
    uses: ./.github/workflows/_app-ci.yml
    with:
      app: apps/asa

  e2e-test:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/asa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # モノレポ: package-lock.json はルートにあるので、ルートで全ワークスペースを入れる。
        working-directory: .
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/asa/playwright-report/
          retention-days: 7

  db-types-check:
    name: Supabase type drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ON_ERROR_STOP が無いと psql -f は SQL エラーでも終了コード 0 になり、壊れた schema.sql が
      # このCIを通ってしまう(#196)。ON_ERROR_STOP で、文法エラーや存在しない参照をここで落とす。
      # あわせて、再適用してもエラーにならない(べき等)ことも確かめる(よるノートの CI と同じ形)。
      - name: Apply schema to scratch database
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/ci/auth-stub.sql supabase/schema.sql supabase/schema.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # Issue #60: version: latest は CLI の破壊的変更で CI が突然落ちうるため固定する
      # (2026-09-16 時点の最新。Dependabot は setup-cli の with.version までは更新しないため、
      #  型生成が古びたら手で上げること)。
      # なお `supabase/setup-cli@v1` のような `v1`/`v3` は**タグではなくブランチ**で、
      # push のたびに中身が変わる(タグより更に可変)。そのため SHA で固定している。
      # 下の SHA は #84 で v1.7.1 から更新した、タグ v3.0.0 の時点のもの。
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Generate types
        run: supabase gen types typescript --db-url postgresql://postgres:postgres@localhost:5432/postgres > /tmp/database.types.ts

      - name: Check for type drift
        run: |
          if ! diff -u apps/asa/src/lib/db/database.types.ts /tmp/database.types.ts; then
            echo "::error::supabase/schema.sqlの変更がapps/asa/src/lib/db/database.types.tsへ反映されていません。'npm run db:types'(要Docker。apps/asa で実行)で再生成し、差分をコミットしてください。"
            exit 1
          fi
