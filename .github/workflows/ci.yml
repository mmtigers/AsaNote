name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #60: 明示しないとリポジトリ設定次第で write 権限のトークンが供給される。全ジョブ読み取り専用。
permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (with coverage)
        # Issue #60: 以前は npm run test のみでカバレッジを CI で計測・保存していなかった。
        # 閾値は設けず(vitest.config.mts のコメント参照)、成果物として残して推移を見る。
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  e2e-test:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db-types-check:
    name: Supabase type drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema to scratch database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/ci/auth-stub.sql
          psql -h localhost -U postgres -d postgres -f supabase/schema.sql

      # Issue #60: version: latest は CLI の破壊的変更で CI が突然落ちうるため固定する
      # (2026-09-16 時点の最新。Dependabot は setup-cli の with.version までは更新しないため、
      #  型生成が古びたら手で上げること)。
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Generate types
        run: supabase gen types typescript --db-url postgresql://postgres:postgres@localhost:5432/postgres > /tmp/database.types.ts

      - name: Check for type drift
        run: |
          if ! diff -u src/lib/db/database.types.ts /tmp/database.types.ts; then
            echo "::error::supabase/schema.sqlの変更がsrc/lib/db/database.types.tsへ反映されていません。'npm run db:types'(要Docker)で再生成し、差分をコミットしてください。"
            exit 1
          fi
