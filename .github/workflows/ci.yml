name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #60: 明示しないとリポジトリ設定次第で write 権限のトークンが供給される。全ジョブ読み取り専用。
permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 本番に入る依存(dependencies)だけを検査する。devDependencies(eslint-config-next 経由の
      # braces, GHSA-vfj7-8cjw-p6xm)には npm 上に修正版が無く、本番コードには入らないため対象外。
      # braces に修正版が出たら --omit=dev を外して全依存の検査へ戻す。
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (with coverage)
        # Issue #60: 以前は npm run test のみでカバレッジを CI で計測・保存していなかった。
        # 閾値は設けず(vitest.config.mts のコメント参照)、成果物として残して推移を見る。
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
