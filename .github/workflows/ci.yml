name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # ラベル・PR本文による例外指定(release-notes-check)を、付けた/書き換えた直後に反映させる。
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #60: 明示しないとリポジトリ設定次第で write 権限のトークンが供給される。全ジョブ読み取り専用。
permissions:
  contents: read

# 共通のジョブ(依存の検査・lint・型・単体テスト・ビルド、更新履歴の検査)は _app-ci.yml にある(#156)。
# ここにはあさノート固有のもの(E2E・型ずれの検査)だけを置く。
jobs:
  lint-build-test:
    uses: ./.github/workflows/_app-ci.yml
    with:
      app: apps/asa

  e2e-test:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/asa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # モノレポ: package-lock.json はルートにあるので、ルートで全ワークスペースを入れる。
        working-directory: .
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/asa/playwright-report/
          retention-days: 7

  db-types-check:
    uses: ./.github/workflows/_db-types-check.yml
    with:
      sql-files: supabase/ci/auth-stub.sql supabase/schema.sql supabase/schema.sql
      types-file: apps/asa/src/lib/db/database.types.ts
      app: apps/asa
      schema-file: supabase/schema.sql
