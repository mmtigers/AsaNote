name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #60: 明示しないとリポジトリ設定次第で write 権限のトークンが供給される。全ジョブ読み取り専用。
permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (with coverage)
        # Issue #60: 以前は npm run test のみでカバレッジを CI で計測・保存していなかった。
        # 閾値は設けず(vitest.config.mts のコメント参照)、成果物として残して推移を見る。
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  e2e-test:
    name: E2E test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db-types-check:
    name: Supabase type drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply schema to scratch database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/ci/auth-stub.sql
          psql -h localhost -U postgres -d postgres -f supabase/schema.sql

      # Issue #60: version: latest は CLI の破壊的変更で CI が突然落ちうるため固定する
      # (2026-09-16 時点の最新。Dependabot は setup-cli の with.version までは更新しないため、
      #  型生成が古びたら手で上げること)。
      # なお `supabase/setup-cli@v1` のような `v1`/`v3` は**タグではなくブランチ**で、
      # push のたびに中身が変わる(タグより更に可変)。そのため SHA で固定している。
      # 下の SHA は #84 で v1.7.1 から更新した、タグ v3.0.0 の時点のもの。
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Generate types
        run: supabase gen types typescript --db-url postgresql://postgres:postgres@localhost:5432/postgres > /tmp/database.types.ts

      - name: Check for type drift
        run: |
          if ! diff -u src/lib/db/database.types.ts /tmp/database.types.ts; then
            echo "::error::supabase/schema.sqlの変更がsrc/lib/db/database.types.tsへ反映されていません。'npm run db:types'(要Docker)で再生成し、差分をコミットしてください。"
            exit 1
          fi

  release-notes-check:
    name: Release notes reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ユーザー向けの変更なのに src/data/releases.ts と package.json の version が
      # 更新し忘れられるのを防ぐための注意喚起(警告のみ・CIは失敗させない)。
      # docsやテストのみの変更、releases.tsに載せるまでもない細かい修正もあるため、
      # 強制はせず気づけるようにするだけに留める。
      - name: Check release notes were updated
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "比較対象のベースコミットが無いため、このチェックをスキップします。"
            exit 0
          fi

          CHANGED_APP_FILES=$(git diff --name-only "$BASE" HEAD -- src/app src/components src/lib \
            | grep -v -E '\.test\.tsx?$' \
            | grep -v -E '^src/lib/db/database\.types\.ts$' \
            | grep -v -E '^src/data/releases\.ts$' || true)

          if [ -z "$CHANGED_APP_FILES" ]; then
            echo "アプリコードの変更なし、または対象外のみのため、このチェックをスキップします。"
            exit 0
          fi

          RELEASE_NOTES_CHANGED=$(git diff --name-only "$BASE" HEAD -- package.json src/data/releases.ts)

          if [ -z "$RELEASE_NOTES_CHANGED" ]; then
            echo "::warning::アプリコードに変更がありますが、package.jsonのversionとsrc/data/releases.tsのどちらも更新されていないようです。ユーザー向けの変更であれば、バージョン更新とリリースノートの追加を検討してください(該当しない変更であれば無視して構いません)。"
          else
            echo "リリースノート/バージョンの更新を確認しました。"
          fi
